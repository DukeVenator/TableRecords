name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, typecheck, non-LLM tests, build, docs
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

      # No model calls run on GitHub Actions. The provider, API, llama.cpp,
      # and prompt-budget suites stay local.
      - run: npm run test:ci

      - run: npm run build:web
      - run: npm run docs:check
